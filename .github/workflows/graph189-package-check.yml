name: Diagnose the Graph 189 flattened proof
on:
  workflow_dispatch:
  push:
    branches: [research/graph189-package-check]

permissions:
  actions: read
  contents: read

concurrency:
  group: graph189-parent-package
  cancel-in-progress: false

env:
  PROOF_ID: WrittenOnTheWallII.GraphConjecture189.conjecture189
  SOURCE_SHA: 9c33964d57066e257b69192a02f05081b2cfc3fe97dc5d7ac6f6414d6eeae43f
  PROOF_SHA: 45c92561b28970cf9b3190c43ffd1f62a918463ac86312469dff05fd477a4918

jobs:
  diagnose:
    if: github.repository == 'ali-hamdan-007/open-math-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lefttosolve2/open-math-agents
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Download the pinned kernel audit artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '15269250949'
          github-token: ${{ github.token }}
          repository: ali-hamdan-007/open-math-agents
          run-id: '46158940698'
          path: ${{ runner.temp }}/graph189-kernel-audit
          merge-multiple: true
      - name: Prepare the upstream Lean environment
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          pin="$(python3 -I -c 'import json; print(json.load(open("data/catalog.json"))["meta"]["upstreamCommit"])')"
          fc="$RUNNER_TEMP/graph189-formal-conjectures"
          git init -q "$fc"
          git -C "$fc" fetch -q --depth 1 https://github.com/google-deepmind/formal-conjectures.git "$pin"
          git -C "$fc" checkout -q --detach FETCH_HEAD
          if ! command -v lake >/dev/null && [[ ! -x "$HOME/.elan/bin/lake" ]]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o "$RUNNER_TEMP/graph189-elan-init.sh"
            sh "$RUNNER_TEMP/graph189-elan-init.sh" -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf 'OMA_FC=%s\n' "$fc" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/graph189-diagnostics"
          cd "$fc"
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/graph189-diagnostics/cache.log"
          timeout 2400 lake build FormalConjectures.WrittenOnTheWallII.GraphConjecture189 2>&1 |
            tee "$RUNNER_TEMP/graph189-diagnostics/import.log"
      - name: Compile the same flattened proof and inspect its dependencies
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/graph189-kernel-audit/parent-package.lean"
          test -f "$source" && test ! -L "$source"
          printf '%s  %s\n' "$SOURCE_SHA" "$source" | sha256sum --check
          diag="$RUNNER_TEMP/graph189-diagnostics"
          cd "$OMA_FC"
          sed 's/^@\[expose\] def marked/def marked/' "$source" > Graph189ParentAudit.lean
          printf '%s  %s\n' "$PROOF_SHA" Graph189ParentAudit.lean | sha256sum --check
          cat >> Graph189ParentAudit.lean <<'LEAN'

          #print axioms OMA.solution
          #print axioms Graph189FullProof.original
          #print axioms Graph189SmallOrderWindow.necessary
          #print axioms Graph189ExteriorLeaf.traceable_three_connected
          #print axioms Graph189TwoConnectivity.of_ten
          #print axioms Graph189ModerateSeven.original
          #print axioms Graph189TwoCutSelect.exists_connected_least_cut
          #print axioms Graph189SmallMixedPair.both
          #print axioms Graph189AdjacentPrivateCut.above_moderate
          #print axioms Graph189SmallMixedPair.nonadjacent_from_seven
          #print axioms Graph189SmallPrivatePair.private_from_seven

          namespace Graph189SorryAudit

          open Lean Elab Command

          private def sourceLabel (n : Name) : CommandElabM String := do
            let some ranges ← findDeclarationRanges? n | return n.toString
            let pos := ranges.range.pos
            return s!"{n} (L{pos.line}:{pos.column + 1})"

          private def traceFrontiers (root : Name) : CommandElabM Unit := do
            unless (← collectAxioms root).contains ``sorryAx do
              logInfo m!"Axiom audit: {root} is sorry-free."
              return
            let env := (← getEnv).setExporting false
            let kernel := env.checked.get
            let mut cache : NameMap Bool := {}
            let mut seen : NameSet := ({} : NameSet).insert root
            let mut queue : Array (Name × List Name) := #[(root, [root])]
            let mut index := 0
            let mut ends := 0
            while h : index < queue.size do
              let (name, revPath) := queue[index]
              index := index + 1
              let some info := kernel.find? name | throwError "No checked declaration for {name}"
              let mut deps := info.type.getUsedConstantsAsSet
              if let some val := info.value? (allowOpaque := true) then
                deps := deps ++ val.getUsedConstantsAsSet
              if let .inductInfo val := info then
                deps := deps ++ .ofList val.ctors
              let mut found := false
              for dep in deps do
                let tainted ← match cache.find? dep with
                  | some b => pure b
                  | none => pure ((← collectAxioms dep).contains ``sorryAx)
                cache := cache.insert dep tainted
                unless tainted do continue
                found := true
                if dep == ``sorryAx || env.isImportedConst dep then
                  let origin := if dep == ``sorryAx then "direct sorryAx" else
                    s!"imported {env.allImportedModuleNames[(env.getModuleIdxFor? dep).get!.toNat]!}"
                  let edge := if info.type.getUsedConstantsAsSet.contains dep then "type" else
                    if (info.value? (allowOpaque := true)).isSome then "value" else "constructor"
                  let path := String.intercalate " -> " ((dep :: revPath).reverse.map Name.toString)
                  logInfo m!"Sorry frontier [{origin}] in {edge} of {← sourceLabel name}: {path}"
                  ends := ends + 1
                else if !seen.contains dep then
                  seen := seen.insert dep
                  queue := queue.push (dep, dep :: revPath)
              unless found do
                logInfo m!"Axiom report and checked declaration differ at {← sourceLabel name}"
            logInfo m!"Sorry audit reached {ends} terminal edges across {seen.size} tainted local declarations."

          set_option maxHeartbeats 0 in
          run_cmd traceFrontiers ``OMA.solution

          end Graph189SorryAudit

          set_option pp.sorrySource true in
          #print sorries OMA.solution
          LEAN
          timeout 2700 lake env lean Graph189ParentAudit.lean 2>&1 | tee "$diag/axioms.log"
      - name: Save the diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph189-flattened-axioms
          path: ${{ runner.temp }}/graph189-diagnostics/
          if-no-files-found: error

